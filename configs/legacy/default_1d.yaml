seed: 42
device: auto
output_dir: runs/default_1d

pde:
  name: burgers
  resolution: 256
  dt: 0.0002
  viscosity_range: [0.003, 0.03]
  ic:
    modes: 5
    amplitude: 1.0

pool:
  rounds: 8
  trajectory_steps: 75
  n_trajectories: 64
  uniform_fraction: 0.25

surrogate:
  model: conv_unet
  hidden: 64
  depth: 3
  ensemble_size: 1
  epochs_per_round: 20
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.00001

ddpm:
  enabled: true
  mode: conditional_loss
  steps: 64
  train_epochs: 10
  batch_size: 128
  lr: 0.0003
  hidden: 64
  loss_condition_scale: 1.0

validation:
  n_trajectories: 128
  trajectory_steps: 99
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  rollout_steps: 50

wandb:
  enabled: true
  project: poolbased-surrogate-1d
  group: default
