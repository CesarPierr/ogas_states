seed: 101
device: cuda
output_dir: /leonardo_scratch/fast/EUHPC_D36_033/ogas_states_runs/burgers_gen/base

# Burgers GENERALITY experiment base config.
# PDE params taken from configs/bigfoot_burgers_phase3_base.yaml (1D Burgers, al4pde
# backend, res256, domain 1.0, dt 2e-4, log-scaled viscosity in [0.003, 0.03], 5-mode IC).
# Pool/surrogate/ddpm structure MIRRORS configs/leonardo_ks_v3_base.yaml (the KS v3 setup)
# but SCALED DOWN because the Burgers solver runs at batch_size=1 with adaptive dt and is
# much slower than the KS solver:
#   pool.rounds 5 (was 10), n_trajectories 100 (was 250), trajectory_steps 30 (was 70),
#   validation.n_trajectories 300 (was 1500), trajectory_steps 50 (was 100), rollout_steps 50.
# Arms override ddpm/pool/surrogate knobs on the command line via --set.

pde:
  name: burgers
  backend: al4pde
  resolution: 256
  domain_length: 1.0
  dt: 0.0002
  viscosity_range: [0.003, 0.03]
  param_ranges:
    - [0.003, 0.03]
  param_log_scale: [true]
  ic:
    modes: 5
    amplitude: 1.0

pool:
  rounds: 5
  trajectory_steps: 30
  n_trajectories: 100
  uniform_fraction: 0.5
  strategy: generator

surrogate:
  hidden: 64
  depth: 4
  ensemble_size: 2
  ensemble_bootstrap: true
  epochs_per_round: 15
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0
  difference_weight: 0.3

ddpm:
  enabled: true
  generator: flow_matching
  mode: conditional_quantile
  param_mode: condition
  param_prior: uniform
  steps: 64
  hidden: 64
  residual_blocks: 2
  kernel_size: 7
  n_quantiles: 20
  quant_embed_dim: 0
  loss_metric: rmse
  difficulty_signal: ensemble_var
  train_epochs: 10
  sample_strategy: top_half
  sample_strategy_temp: 0.5
  batch_size: 128
  lr: 0.0002
  sample_temperature: 1.0
  sample_batch_size: 2048
  generated_pool_mode: transition
  solver_batch_size: 1024
  # --- v3 conditioning hygiene (mirrors leonardo_ks_v3_base) ---
  difficulty_from: pretrain
  difficulty_stats: ema
  difficulty_stats_momentum: 0.7
  self_train_weight: 0.3
  noise_prior: spectrum
  candidate_factor: 4
  realism_tv_gate: 3.0
  sample_mode: scratch          # gen_phys_tv_edit arm overrides to edit

validation:
  n_trajectories: 300
  trajectory_steps: 50
  path: /leonardo_scratch/fast/EUHPC_D36_033/ogas_validation/burgers_res256_bank.npz
  hard_dir: /leonardo_scratch/fast/EUHPC_D36_033/ogas_validation/burgers_diverse_suite
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.99]
  rollout_steps: 50
  epoch_n_trajectories: 150

wandb:
  enabled: true
  project: poolbased-surrogate-1d
  group: burgers_gen
