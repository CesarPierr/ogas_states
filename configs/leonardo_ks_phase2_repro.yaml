seed: 101
device: auto
output_dir: /leonardo_scratch/fast/EUHPC_D36_033/ogas_states_runs/ks800_phase2_repro/base

# Phase 2 base config (see docs/roadmap.md Phase 2). Stronger surrogate (hidden 64 +
# ensemble 3) to (a) leave the degenerate rollout regime and (b) provide the ensemble
# disagreement difficulty signal. Best generator from G1: fm_s64_h64 + nq20 + top_half.
# uniform_fraction and ddpm.difficulty_signal are swept via --set in the launch script.

pde:
  name: ks
  resolution: 800
  domain_length: 64.0
  dt: 0.05
  param_ranges:
    - [0.5, 4.0]
    - [10.0, 100.0]
  param_log_scale: [false, false]
  n_substeps: 5
  n_warmup: 20
  ic:
    N: 10
    lmin: 1
    lmax: 10
    amplitude: 1.0

pool:
  rounds: 10   # uniform val saturates by round ~3; 10 rounds captures the hard/tube coverage trend and fits V100 walltime (no A100 relaunch needed). Analyze at matched round 10.
  trajectory_steps: 70
  n_trajectories: 250
  uniform_fraction: 0.5

surrogate:
  hidden: 64
  depth: 4
  ensemble_size: 2   # was 3; reduced for cheaper/faster runs (affects future runs only)
  epochs_per_round: 15
  batch_size: 128   # hidden64+ensemble3 at res800: batch512 OOMs (~25GiB); 128 fits with margin
  lr: 0.001
  weight_decay: 0.0
  difference_weight: 0.3

ddpm:
  enabled: true
  generator: flow_matching
  mode: conditional_quantile
  param_mode: condition
  param_prior: uniform
  steps: 64
  hidden: 64
  residual_blocks: 2
  kernel_size: 7
  n_quantiles: 20
  quant_embed_dim: 0
  loss_metric: rmse
  difficulty_signal: loss
  train_epochs: 10
  sample_strategy: top_half
  sample_strategy_temp: 0.5
  batch_size: 128   # flow-matching at res800/hidden64: keep memory bounded
  lr: 0.0002
  sample_temperature: 1.0
  sample_batch_size: 2048
  generated_pool_mode: transition
  solver_batch_size: 1024

validation:
  n_trajectories: 1500
  trajectory_steps: 100
  path: /leonardo_scratch/fast/EUHPC_D36_033/ogas_validation/ks_res800_al4pde_sub5_seed43_n1500_t100.npz
  hard_dir: /leonardo_scratch/fast/EUHPC_D36_033/ogas_validation/ks_diverse_suite
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.99]
  rollout_steps: 100
  epoch_n_trajectories: 150

wandb:
  enabled: true
  project: poolbased-vague2-leonardo
  group: ks800_phase2_repro
